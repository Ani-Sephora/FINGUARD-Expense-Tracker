<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar - FinGuard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='js/theme.js') }}" defer></script>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
  <style>
    .calendar-card {
      padding: 12px;
      overflow: visible;
    }

    .calendar-head {
      align-items: flex-start;
      position: relative;
      z-index: 5;
    }

    .download-wrap {
      position: relative;
      flex: 0 0 auto;
    }

    .download-toggle {
      width: 44px;
      min-height: 44px;
      padding: 0;
      border-radius: 14px;
    }

    .download-toggle::before {
      content: "\2193";
      font-size: 1.2rem;
      line-height: 1;
    }

    .download-panel {
      position: absolute;
      top: 52px;
      right: 0;
      width: min(250px, calc(100vw - 48px));
      display: none;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
      z-index: 20;
    }

    .download-panel.open {
      display: grid;
    }

    .download-panel select {
      min-height: 44px;
      border-radius: 13px;
    }

    #calendar {
      width: 100%;
      min-height: 430px;
      overflow: hidden;
    }

    .fc {
      --fc-border-color: var(--line);
      --fc-button-bg-color: var(--primary);
      --fc-button-border-color: var(--primary);
      --fc-button-hover-bg-color: var(--primary-2);
      --fc-button-hover-border-color: var(--primary-2);
      --fc-today-bg-color: color-mix(in srgb, var(--primary) 12%, transparent);
      font-family: inherit;
      font-size: 0.72rem;
      color: var(--ink);
    }

    .fc .fc-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: nowrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .fc .fc-toolbar-chunk {
      display: flex;
      justify-content: center;
      gap: 6px;
      min-width: 0;
    }

    .fc .fc-toolbar-chunk:nth-child(2) {
      flex: 1 1 auto;
    }

    .fc .fc-toolbar-title {
      font-size: 0.95rem;
      color: var(--ink);
      font-weight: 950;
      text-align: center;
      white-space: nowrap;
    }

    .fc .fc-button {
      min-height: 34px;
      min-width: 38px;
      padding: 0 8px;
      border-radius: 11px;
      font-size: 0.72rem;
      font-weight: 900;
      box-shadow: none;
    }

    .fc .fc-view-harness,
    .fc .fc-view-harness-active,
    .fc .fc-daygrid,
    .fc .fc-scroller,
    .fc .fc-daygrid-body,
    .fc .fc-scrollgrid,
    .fc .fc-scrollgrid-section,
    .fc .fc-scrollgrid-section table,
    .fc .fc-col-header,
    .fc .fc-daygrid-body table,
    .fc .fc-scrollgrid-sync-table {
      width: 100% !important;
      min-width: 0 !important;
      max-width: 100% !important;
    }

    .fc table {
      width: 100% !important;
      min-width: 0 !important;
      table-layout: fixed !important;
    }

    .fc th,
    .fc td {
      width: 14.2857% !important;
      min-width: 0 !important;
      padding-left: 0;
      padding-right: 0;
    }

    .fc .fc-scrollgrid,
    .fc .fc-daygrid-day-frame {
      border-radius: 12px;
    }

    .fc .fc-col-header-cell-cushion,
    .fc .fc-daygrid-day-number {
      color: var(--muted);
      font-weight: 900;
      text-decoration: none;
    }

    .fc .fc-daygrid-day-frame {
      min-height: 62px;
      padding: 2px;
      background: color-mix(in srgb, var(--surface) 88%, var(--surface-2));
    }

    .fc .fc-daygrid-day-top {
      justify-content: center;
    }

    .fc-event {
      border: 0;
      border-radius: 999px;
      padding: 2px 5px;
      font-size: 0.62rem;
      font-weight: 850;
      line-height: 1.2;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.08);
    }

    .fc-daygrid-event {
      white-space: nowrap;
      overflow: hidden;
    }

    .fc .fc-daygrid-more-link {
      color: var(--primary);
      font-size: 0.62rem;
      font-weight: 900;
    }

    .calendar-tooltip {
      position: fixed;
      width: min(240px, calc(100vw - 32px));
      display: none;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--shadow);
      z-index: 100;
      pointer-events: none;
    }

    .calendar-tooltip.visible {
      display: grid;
      gap: 5px;
    }

    .calendar-tooltip strong {
      color: var(--primary);
      font-size: 0.92rem;
    }

    .calendar-tooltip span {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
    }

    @media (max-width: 360px) {
      .calendar-card {
        padding: 9px;
      }

      .fc {
        font-size: 0.66rem;
      }

      .fc .fc-daygrid-day-frame {
        min-height: 54px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="app-header">
      <div class="header-user">
        <div class="avatar">C</div>
        <div>
          <p class="app-title">Calendar</p>
          <p class="app-subtitle">{{ username }} financial timeline</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="theme-toggle" type="button" aria-label="Change theme" title="Change theme"></button>
        <a class="icon-button back-button" href="{{ url_for('dashboard') }}" aria-label="Back">&larr;</a>
      </div>
    </header>

    <section class="balance-card">
      <p class="balance-label">Balance</p>
      <h1 class="balance-value">Rs. {{ balance }}</h1>
      <div class="balance-meta">
        <div><span>Income</span><strong>Rs. {{ income }}</strong></div>
        <div><span>Expense</span><strong>Rs. {{ expenses }}</strong></div>
        <div><span>Saving</span><strong>Rs. {{ savings }}</strong></div>
      </div>
    </section>

    <section class="section calendar-card">
      <div class="section-head calendar-head">
        <div>
          <span class="eyebrow">Timeline</span>
          <h2>Money calendar</h2>
        </div>
        <div class="download-wrap">
          <button class="btn download-toggle" id="downloadToggle" type="button" aria-label="Download statement" title="Download statement"></button>
          <form method="POST" action="{{ url_for('download_report') }}" class="download-panel" id="downloadPanel">
            <select name="months" aria-label="Choose month range" required>
              <option value="1">Last 1 Month</option>
              <option value="2">Last 2 Months</option>
              <option value="3">Last 3 Months</option>
              <option value="4">Last 4 Months</option>
              <option value="5">Last 5 Months</option>
              <option value="6">Last 6 Months</option>
            </select>
            <select name="format" aria-label="Choose download type" required>
              <option value="csv">CSV</option>
              <option value="pdf">PDF</option>
            </select>
            <button type="submit">Download</button>
          </form>
        </div>
      </div>
      <div id="calendar"></div>
    </section>

    <div class="calendar-tooltip" id="calendarTooltip" role="status" aria-live="polite"></div>

    <nav class="bottom-nav" aria-label="App tabs">
      <a href="{{ url_for('dashboard') }}"><b>H</b><span>Home</span></a>
      <a href="{{ url_for('visualization') }}"><b>R</b><span>Reports</span></a>
      <a class="active" href="{{ url_for('calendar_view') }}"><b>C</b><span>Calendar</span></a>
      <a href="{{ url_for('goal_planner') }}"><b>G</b><span>Goals</span></a>
      <a href="{{ url_for('profile') }}"><b>P</b><span>Profile</span></a>
    </nav>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const calendarEl = document.getElementById('calendar');
      const tooltip = document.getElementById('calendarTooltip');
      const downloadToggle = document.getElementById('downloadToggle');
      const downloadPanel = document.getElementById('downloadPanel');

      function showTooltip(info, x, y) {
        const props = info.event.extendedProps;
        tooltip.innerHTML = `
          <strong>${props.type} - Rs. ${props.amount}</strong>
          <span>${props.description}</span>
          <span>${props.category}</span>
          <span>${props.date}</span>
        `;
        const left = Math.min(x + 12, window.innerWidth - 256);
        const top = Math.min(y + 12, window.innerHeight - 150);
        tooltip.style.left = `${Math.max(12, left)}px`;
        tooltip.style.top = `${Math.max(12, top)}px`;
        tooltip.classList.add('visible');
      }

      function hideTooltip() {
        tooltip.classList.remove('visible');
      }

      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        height: 'auto',
        contentHeight: 'auto',
        expandRows: true,
        dayMaxEvents: 2,
        events: {{ events | tojson | safe }},
        eventDisplay: 'block',
        displayEventTime: false,
        headerToolbar: {
          left: 'prev',
          center: 'title',
          right: 'next'
        },
        eventMouseEnter: function(info) {
          showTooltip(info, info.jsEvent.clientX, info.jsEvent.clientY);
        },
        eventMouseLeave: hideTooltip,
        eventClick: function(info) {
          info.jsEvent.preventDefault();
          showTooltip(info, info.jsEvent.clientX, info.jsEvent.clientY);
        }
      });

      calendar.render();

      downloadToggle.addEventListener('click', function () {
        downloadPanel.classList.toggle('open');
      });

      document.addEventListener('click', function (event) {
        if (!downloadPanel.contains(event.target) && event.target !== downloadToggle) {
          downloadPanel.classList.remove('open');
        }
        if (!calendarEl.contains(event.target)) {
          hideTooltip();
        }
      });
    });
  </script>
</body>
</html>
