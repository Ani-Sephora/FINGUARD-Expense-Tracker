<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verify OTP - FinGuard</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #eaf6f6, #d4e0fc);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .form-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      width: 400px;
      text-align: center;
    }
    h2 {
      color: #2c3e50;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 1rem;
      text-align: center;
      letter-spacing: 4px;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background-color: #2980b9;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover {
      background-color: #3498db;
    }
    .info {
      font-size: 0.9rem;
      color: #555;
      margin-top: 10px; 
    }
  </style>
</head>
<body>
  <div class="form-box">
    <h2>📧 Verify Your OTP</h2>
    <p class="info">We’ve sent a 6-digit OTP to your email. Enter it below to complete registration.</p>
    <form method="POST">
      <input type="text" name="otp" placeholder="Enter OTP" required>
      <button type="submit">Verify & Continue</button>
    </form>
  </div>
</body>
</html>
