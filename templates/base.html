<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{ title if title else "FinGuard" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/mymoney.css') }}">
  {% block head %}{% endblock %}
</head>

<body class="app-shell">
  <main class="app-main">
    {% block content %}{% endblock %}
  </main>

  <!-- Floating Add Button -->
  <a class="fab" href="{{ url_for('dashboard') }}" title="Add Transaction">+</a>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a class="nav-item {% if active=='records' %}active{% endif %}" href="{{ url_for('dashboard') }}">
      <span>📄</span><small>Records</small>
    </a>
    <a class="nav-item {% if active=='analysis' %}active{% endif %}" href="{{ url_for('analysis') }}">
      <span>📈</span><small>Analysis</small>
    </a>
    <a class="nav-item {% if active=='budgets' %}active{% endif %}" href="{{ url_for('budgets') }}">
      <span>🧾</span><small>Budgets</small>
    </a>
    <a class="nav-item {% if active=='accounts' %}active{% endif %}" href="{{ url_for('accounts') }}">
      <span>💳</span><small>Accounts</small>
    </a>
    <a class="nav-item {% if active=='categories' %}active{% endif %}" href="{{ url_for('categories') }}">
      <span>🏷️</span><small>Categories</small>
    </a>
  </nav>

  <script src="{{ url_for('static', filename='js/mymoney.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
