<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expenditure Chart - {{ username }}</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='js/theme.js') }}" defer></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #ddeeff, #eef5ff);
      margin: 0;
    }

    .navbar {
      background-color: #2c3e50;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar h2 {
      margin: 0;
      font-size: 1.6rem;
      color: #ecf0f1; /* Adjusted for visibility */
    }

    .nav-links a {
      color: #f8f9fa;
      text-decoration: none;
      margin-left: 20px;
      font-weight: bold;
    }

    .container {
      max-width: 800px;
      margin: 2rem auto;
      background-color: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    canvas {
      width: 100%;
      max-height: 400px;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <h2>📊 Expenditure Chart - {{ username }}</h2>
    <div class="nav-links">
      <a href="{{ url_for('profile') }}"><span class="icon-colored">👤</span> Profile</a>
      <a href="{{ url_for('logout') }}">🔒 Logout</a>
    </div>
  </div>

  <div class="container">
    <canvas id="categoryChart"></canvas>
  </div>

  <script>
    const labels = {{ labels | safe }};
    const dataPoints = {{ dataPoints | safe }};

    const ctx = document.getElementById('categoryChart').getContext('2d');
    const data = {
      labels: labels,
      datasets: [{
        label: 'Total Spending by Category (₹)',
        data: dataPoints,
        backgroundColor: [
          '#ff6384', '#36a2eb', '#ffce56', '#8e44ad', '#00b894', '#e17055', '#fd79a8', '#f39c12', '#1abc9c'
        ],
        hoverOffset: 10
      }]
    };

    new Chart(ctx, {
      type: 'doughnut',
      data: data,
      options: {
        responsive: true,
        plugins: {
          legend: {
            position: 'bottom',
            labels: {
              color: '#2c3e50',
              font: {
                weight: 'bold'
              }
            }
          },
          title: {
            display: true,
            text: 'Expenditure by Category',
            color: '#34495e',
            font: {
              size: 20,
              weight: 'bold'
            }
          }
        }
      }
    });
  </script>
</body>
</html>
