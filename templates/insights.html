<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insights - FinGuard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='js/theme.js') }}" defer></script>
</head>
<body>
  <main class="page">
    <header class="app-header">
      <div class="header-user">
        <a class="icon-button back-button" href="{{ url_for('dashboard') }}" aria-label="Back">&larr;</a>
        <div>
          <p class="app-title">Insights</p>
          <p class="app-subtitle">Based on your income, savings, and expenses</p>
        </div>
      </div>
      <button class="theme-toggle" type="button" aria-label="Change theme" title="Change theme"></button>
    </header>

    <section class="balance-card insight-hero">
      <p class="balance-label">Insight of the Month</p>
      <h1 class="insight-title">{{ insights.home }}</h1>
    </section>

    {% for section in insights.sections %}
      <section class="section insight-section">
        <span class="eyebrow">Section {{ loop.index }}</span>
        <h2>{{ section.title }}</h2>
        <div class="insight-list">
          {% for item in section["items"] %}
            <div class="insight-row">
              <span>{{ item }}</span>
            </div>
          {% endfor %}
        </div>
      </section>
    {% endfor %}

    <nav class="bottom-nav" aria-label="App tabs">
      <a href="{{ url_for('dashboard') }}"><b>H</b><span>Home</span></a>
      <a href="{{ url_for('visualization') }}"><b>R</b><span>Reports</span></a>
      <a href="{{ url_for('calendar_view') }}"><b>C</b><span>Calendar</span></a>
      <a href="{{ url_for('goal_planner') }}"><b>G</b><span>Goals</span></a>
      <a href="{{ url_for('profile') }}"><b>P</b><span>Profile</span></a>
    </nav>
  </main>
</body>
</html>
